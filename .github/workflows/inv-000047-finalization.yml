name: INV-000047 finalization
on:
  push:
    branches: ['validation/inv-000047-finalization']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'jsonschema>=4.18'
      - name: Verify accepted chain and render
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python -m research_atelier.validation.validate_investigation INV-000047 --through 30
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          from research_atelier.projection.working_answer import patch_working_answer_section, working_answer_projection_state
          p=Path('investigations/INV-000047')
          a=json.loads((p/'30_analysis.json').read_text())
          review=json.loads((p/'reviews/review-000002.json').read_text())
          assert review['verdict']=='PASS'
          for stage,sha in review['target']['artifact_blob_shas'].items():
              actual=subprocess.check_output(['git','rev-parse','HEAD:'+str(p/(stage+'.json'))],text=True).strip()
              assert actual==sha
          assert subprocess.run(['git','merge-base','--is-ancestor',review['target']['commit_sha'],'HEAD']).returncode==0
          body=''
          patch=patch_working_answer_section(body,a)
          assert working_answer_projection_state(body,a)=='MISSING' and patch.action=='CREATE'
          print('RENDER_JSON='+json.dumps(patch.markdown,ensure_ascii=False))
          PY
