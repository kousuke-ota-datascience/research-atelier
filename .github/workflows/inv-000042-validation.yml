name: Validate EOL Investigation 000042
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inv-000042-validation.yml'
      - 'investigations/INV-000042/00_context.json'
      - 'investigations/INV-000042/10_evidence.json'
      - 'investigations/INV-000042/20_synthesis.json'
      - 'investigations/INV-000042/30_analysis.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install validator dependency
        run: python -m pip install 'jsonschema>=4.18'
      - name: Validate INV-000042 canonical chain
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python -m research_atelier.validation.validate_investigation INV-000042 --through 30
