name: Validate EOL Investigation 000042
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inv-000042-validation.yml'
      - 'investigations/INV-000042/00_context.json'
      - 'investigations/INV-000042/10_evidence.json'
      - 'investigations/INV-000042/20_synthesis.json'
      - 'investigations/INV-000042/30_analysis.json'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install validator dependency
        run: python -m pip install 'jsonschema>=4.18'
      - name: Execute canonical validator and record exact result
        env:
          PYTHONPATH: src
        run: |
          set -uo pipefail
          python -m research_atelier.validation.validate_investigation INV-000042 --through 30 > /tmp/inv42_validation.json
          code=$?
          export VALIDATION_EXIT_CODE="$code"
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          validator_result = json.loads(Path("/tmp/inv42_validation.json").read_text())
          data = {
              "validation_target_commit_sha": os.environ["GITHUB_SHA"],
              "validated_at": datetime.now(timezone.utc).isoformat(),
              "validator_command": "python -m research_atelier.validation.validate_investigation INV-000042 --through 30",
              "exit_code": int(os.environ["VALIDATION_EXIT_CODE"]),
              "validation": validator_result
          }
          dest = Path(".github/validation-results/INV-000042.json")
          dest.parent.mkdir(parents=True, exist_ok=True)
          dest.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n")
          PY
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add .github/validation-results/INV-000042.json
          git commit -m "ci: record canonical INV-000042 validation result"
          git push origin HEAD:main
          exit "$code"
