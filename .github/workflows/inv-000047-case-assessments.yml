name: INV-000047 derived case assessments validation
on:
  push:
    branches: ['validation/inv-000047-case-assessments']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'jsonschema>=4.18'
      - name: Test both contracts and generate derivative
        run: |
          set -euo pipefail
          git checkout --detach origin/main
          test "$(git rev-parse HEAD:investigations/INV-000047/derived/case_assessments.json)" = f1605592ea6b77f809150ba01258412c5edb359f
          test "$(git rev-parse HEAD:investigations/INV-000047/30_analysis.json)" = 6486b4a5775229feab2cd7b97a85548da1466073
          python -m unittest discover -s tools/case_assessments -p 'test*.py' -v
          python tools/case_assessments/build.py INV-000046 --check
          if [ -f investigations/INV-000047/derived/case_assessments.json ]; then
            python tools/case_assessments/build.py INV-000047 --check
          fi
          python tools/case_assessments/build.py INV-000047
          python tools/case_assessments/build.py INV-000047 --check
          git diff --exit-code -- investigations/INV-000047/derived/case_assessments.json
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          data=Path('investigations/INV-000047/derived/case_assessments.json').read_bytes()
          obj=json.loads(data)
          print('DERIVATIVE_SUMMARY='+json.dumps(obj['summary'],ensure_ascii=False))
          print('DERIVATIVE_SHA256='+hashlib.sha256(data).hexdigest())
          encoded=data.decode('utf-8')
          PY
