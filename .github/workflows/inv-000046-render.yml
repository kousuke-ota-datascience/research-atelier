name: INV-000046 Working Answer rendering
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'jsonschema>=4.18'
      - run: |
          PYTHONPATH=src python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone
          from research_atelier.projection.working_answer import working_answer_projection_state, build_projection_log_v2
          a=json.loads(Path('investigations/INV-000046/30_analysis.json').read_text())
          state=working_answer_projection_state(Path('ops/inv-000046-readback.md').read_text(),a)
          print('PROJECTION_STATE',state)
          log=build_projection_log_v2(target_rq_url='https://app.notion.com/p/424e5855be3981b8b6f0f3e8cb0851cf',rq_id='RQ-000045',source_investigation_id='INV-000046',source_30_analysis_commit_sha='b2538ade8d63ad43bbac806b895c6c1cdc9681bc',projection_timestamp=datetime.now(timezone.utc).isoformat(),result='SUCCESS' if state=='CURRENT' else 'FAILURE',note='Notion body readback: '+state)
          print('PROJECTION_LOG '+json.dumps(log,ensure_ascii=False))
          assert state=='CURRENT'
          PY
