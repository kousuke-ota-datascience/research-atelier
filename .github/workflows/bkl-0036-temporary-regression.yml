name: BKL-0036 temporary regression
# verification-only workflow; removed before merge

on:
  pull_request:
    branches: [main]

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check jsonschema
      - run: python -m compileall -q src tests
      - name: BKL-0035 allocation guard regression
        run: PYTHONPATH=tests python -m unittest -v test_investigation_allocation
      - name: BKL-0036 Review lifecycle regression
        run: |
          PYTHONPATH=tests python -m unittest -v \
            test_review_contract.ReviewContractTest.test_new_investigation_finding_alone_does_not_close_review \
            test_review_contract.ReviewContractTest.test_valid_successor_handoff_transitions_to_terminal_state \
            test_review_contract.ReviewContractTest.test_handoff_record_matches_current_schema \
            test_review_contract.ReviewContractTest.test_handoff_preflight_reuses_existing_successor_before_allocation \
            test_review_contract.ReviewContractTest.test_handoff_preflight_blocks_conflicting_existing_record \
            test_review_contract.ReviewContractTest.test_handoff_plan_is_idempotent_and_preserves_original_timestamp \
            test_review_contract.ReviewContractTest.test_handoff_blocks_until_successor_persisted_and_exactly_bound \
            test_review_contract.ReviewContractTest.test_handoff_blocks_without_allocate_new_versioning_decision \
            test_review_contract.ReviewContractTest.test_notion_handoff_status_without_canonical_fact_does_not_authorize_terminal_state \
            test_review_contract.ReviewContractTest.test_handoff_event_without_canonical_record_blocks \
            test_review_contract.ReviewContractTest.test_handoff_payload_reconciliation_is_idempotent \
            test_review_projection.ReviewProjectionRegressionTests.test_new_investigation_handoff_keeps_reviews_db_verdict_as_findings
