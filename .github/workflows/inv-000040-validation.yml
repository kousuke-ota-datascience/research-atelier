name: Canonical validator INV-000040
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'jsonschema>=4.18'
      - name: Check canonical information source metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker
          schema = json.loads(Path("schemas/v2/information_source.schema.json").read_text())
          for uid in range(220, 229):
              source = Path(f"information_sources/SRC-{uid:06d}.json")
              Draft202012Validator(schema, format_checker=FormatChecker()).validate(json.loads(source.read_text()))
              print("PASS", source)
          PY
      - name: Canonical CLI new Context freeze
        env:
          PYTHONPATH: src
        run: python -m research_atelier.validation.validate_investigation INV-000040 --through 00 --new-freeze
      - name: Canonical CLI through-10
        env:
          PYTHONPATH: src
        run: python -m research_atelier.validation.validate_investigation INV-000040 --through 10
      - name: Canonical CLI through-20
        env:
          PYTHONPATH: src
        run: python -m research_atelier.validation.validate_investigation INV-000040 --through 20
      - name: Canonical CLI through-30
        env:
          PYTHONPATH: src
        run: python -m research_atelier.validation.validate_investigation INV-000040 --through 30

      - name: Validate INV-000040 body projection log
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker
          schema = json.loads(Path("schemas/v2/projection_log.schema.json").read_text())
          log = json.loads(Path("investigations/INV-000040/projection_log_v2.json").read_text())
          Draft202012Validator(schema, format_checker=FormatChecker()).validate(log)
          assert log["result"] == "SUCCESS"
          assert log["projection_target"] == {"surface": "page_body", "section_heading": "# Working Answer"}
          print("PASS projection_log_v2.json")
          PY

      - name: Preflight canonical allocation guard and Review reconciliation
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          from research_atelier.orchestration.investigation_allocation import decide_investigation_allocation
          from research_atelier.reviewing.reconcile import reconcile_payload
          root=Path("investigations/INV-000040")
          context=json.loads((root/"00_context.json").read_text())
          review=json.loads((root/"reviews/review-000001.json").read_text())
          decision=decide_investigation_allocation(
              intent="repair",
              existing_investigation_id="INV-000040",
              existing_context=context,
              requested_context={"rq_id":"RQ-000040"},
          )
          assert decision.decision == "reuse_existing", decision.as_dict()
          assert review["verdict"]=="FINDINGS" and review["review_seq"]==1
          subprocess.run(["git","merge-base","--is-ancestor",review["target"]["commit_sha"],"HEAD"],check=True)
          files={"00_context":"00_context.json","10_evidence":"10_evidence.json","20_synthesis":"20_synthesis.json","30_analysis":"30_analysis.json"}
          actual={key:subprocess.check_output(["git","rev-parse",f"HEAD:investigations/INV-000040/{filename}"],text=True).strip() for key,filename in files.items()}
          old=review["target"]["artifact_blob_shas"]
          assert old["00_context"]==actual["00_context"]
          assert any(old[layer]!=actual[layer] for layer in ("10_evidence","20_synthesis","30_analysis"))
          plan=reconcile_payload({
              "current":{"review_status":"要修正","latest_review_seq":1},
              "review":{"latest":review,"target_relation":"stale","issues":[]},
              "context":context,"events":{}
          })
          print("allocation:",decision.as_dict())
          print("review reconciliation:",plan)
          assert plan["outcome"]=="UPDATE" and plan["changes"]=={"Review Status":"再レビュー待"},plan
          PY
