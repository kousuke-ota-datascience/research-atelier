name: Canonical validator INV-000040
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'jsonschema>=4.18'
      - name: Check canonical information source metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker
          schema = json.loads(Path("schemas/v2/information_source.schema.json").read_text())
          for uid in range(220, 229):
              source = Path(f"information_sources/SRC-{uid:06d}.json")
              Draft202012Validator(schema, format_checker=FormatChecker()).validate(json.loads(source.read_text()))
              print("PASS", source)
          PY
      - name: Canonical CLI new Context freeze
        env:
          PYTHONPATH: src
        run: python -m research_atelier.validation.validate_investigation INV-000040 --through 00 --new-freeze
      - name: Canonical CLI through-10
        env:
          PYTHONPATH: src
        run: python -m research_atelier.validation.validate_investigation INV-000040 --through 10
      - name: Canonical CLI through-20
        env:
          PYTHONPATH: src
        run: python -m research_atelier.validation.validate_investigation INV-000040 --through 20
      - name: Canonical CLI through-30
        env:
          PYTHONPATH: src
        run: python -m research_atelier.validation.validate_investigation INV-000040 --through 30

      - name: Validate INV-000040 body projection log
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker
          schema = json.loads(Path("schemas/v2/projection_log.schema.json").read_text())
          log = json.loads(Path("investigations/INV-000040/projection_log_v2.json").read_text())
          Draft202012Validator(schema, format_checker=FormatChecker()).validate(log)
          assert log["result"] == "SUCCESS"
          assert log["projection_target"] == {"surface": "page_body", "section_heading": "# Working Answer"}
          print("PASS projection_log_v2.json")
          PY
