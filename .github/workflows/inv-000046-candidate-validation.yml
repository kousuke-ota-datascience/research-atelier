name: INV-000046 candidate context validation
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'jsonschema>=4.18'
      - name: Canonical new-freeze validator
        env:
          PYTHONPATH: src
        run: |
          git hash-object investigations/INV-000046/00_context.json
          python -m research_atelier.validation.validate_investigation INV-000046 --through 00 --new-freeze
