name: INV-000047 repair validation
on:
  push:
    branches: ['validation/inv-000047-review-000001']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'jsonschema>=4.18'
      - name: Validate canonical chain
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          for stage in 00 10 20 30; do
            python -m research_atelier.validation.validate_investigation INV-000047 --through "$stage"
          done
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          from research_atelier.reviewing.reconcile import reconcile_payload
          p=Path('investigations/INV-000047')
          context=json.loads((p/'00_context.json').read_text())
          review=json.loads((p/'reviews/review-000001.json').read_text())
          actual={k:subprocess.check_output(['git','rev-parse','HEAD:'+str(p/(k+'.json'))],text=True).strip() for k in review['target']['artifact_blob_shas']}
          assert actual['00_context']==review['target']['artifact_blob_shas']['00_context']
          relation='exact' if actual==review['target']['artifact_blob_shas'] else 'stale'
          assert subprocess.run(['git','merge-base','--is-ancestor',review['target']['commit_sha'],'HEAD']).returncode==0
          payload={'current':{'review_status':'要修正' if relation=='exact' else '再作業中','latest_review_seq':1},'context':context,'review':{'latest':review,'target_relation':relation,'issues':[]},'events':{'repair_started':relation=='exact'}}
          result=reconcile_payload(payload)
          print('RECONCILE_RESULT='+json.dumps(result,ensure_ascii=False))
          assert result['outcome']=='UPDATE' and not result['issues']
          PY
