name: Canonical validator INV-000041
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'jsonschema>=4.18'
      - name: Canonical new-Investigation allocation guard
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from research_atelier.orchestration.investigation_allocation import decide_investigation_allocation
          previous=json.loads(Path("investigations/INV-000040/00_context.json").read_text())
          result=decide_investigation_allocation(
              intent="explicit_new_execution",
              existing_investigation_id="INV-000040",
              existing_context=previous,
              requested_context={"rq_id":"RQ-000040","question_type":"Descriptive"},
          )
          print(result.as_dict())
          assert result.decision == "allocate_new"
          assert result.explicit_new_execution_intent is True
          assert "explicit_independent_execution" in result.reason_codes
          PY
      - name: Canonical CLI new Context freeze
        env:
          PYTHONPATH: src
        run: python -m research_atelier.validation.validate_investigation INV-000041 --through 00 --new-freeze
      - name: Validate 25 new canonical Source metadata records
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker
          schema=json.loads(Path('schemas/v2/information_source.schema.json').read_text())
          for uid in range(229,254):
              p=Path(f'information_sources/SRC-{uid:06d}.json')
              source=json.loads(p.read_text())
              Draft202012Validator(schema,format_checker=FormatChecker()).validate(source)
              assert source['source_id']==f'SRC-{uid:06d}'
              print("PASS", p)
          PY
