name: INV-000048 finalization
on: [pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install jsonschema
      - name: Verify Notion readback and build log
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import json,pathlib,datetime
          from research_atelier.projection.working_answer import working_answer_projection_state,build_projection_log_v2
          from research_atelier.validation.schema_validator import validate_data
          p=pathlib.Path("investigations/INV-000048")
          a=json.loads((p/"30_analysis.json").read_text())
          body=json.loads("\"# Working Answer\\n\\n## Answer\\n\\n## 回答と採択判定\\n\\n公開原典7件から独立ユースケース6件を探索的に選択した。SUBARUの2019年・2022年発表は同一事例として統合。固定Contextの基準によると、統合型0件、品質保証型0件、状態基準保全型0件、品質推定事例4件（C01、C02、C03、C05）、近接事例2件（C04、C06）。品質保証型・状態基準保全型は共通R1–R3と該当経路の意思決定および成果がともに確認できる場合とする。0件は探索集合内の判定であって不存在を示さない。C01は量産のA介入を確認、C04はB介入と定性的成果を確認するが品質推定の検証は未確認。最適化実証はいずれも未確認。\\n\\n| Case | R1 | R2 | R3 | R4-A | R5-A | R4-B | R5-B | 採択区分 |\\n| --- | --- | --- | --- | --- | --- | --- | --- | --- |\\n| C01 | 確認済 | 確認済 | 確認済 | 確認済 | 未確認 | 未確認 | 未確認 | 品質推定事例（量産実装・A意思決定確認済） |\\n| C02 | 確認済 | 確認済 | 確認済 | 未確認 | 未確認 | 未確認 | 未確認 | 品質推定事例（機上測定システム開発・介入構想） |\\n| C03 | 確認済 | 確認済 | 確認済 | 未確認 | 未確認 | 未確認 | 未確認 | 品質推定事例（実加工データ・オフライン検証） |\\n| C04 | 確認済 | 未確認 | 未確認 | 未確認 | 未確認 | 確認済 | 確認済 | 近接事例（R4-B/R5-Bの定性的成果確認済） |\\n| C05 | 確認済 | 確認済 | 確認済 | 未確認 | 未確認 | 未確認 | 未確認 | 品質推定事例（実験・オフライン評価） |\\n| C06 | 確認済 | 確認済 | 未確認 | 未確認 | 未確認 | 未確認 | 未確認 | 近接事例（劣化・品質限界の関連を実験で検証） |\\n\\n「確認済」は原典の報告存在を示し独立再現・因果識別を意味しない。「未確認」は証拠不足であり不適合とは異なる。全10カテゴリの未収集属性は未知とする。\\n\\n### C01 SUBARU・富士通：量産カムシャフト品質判定\\n\\n- 採択区分：品質推定事例（量産実装・A意思決定確認済）（K0001, K0002）\\n- R1 確認済 / R2 確認済 / R3 確認済 / R4-A 確認済 / R5-A 未確認 / R4-B 未確認 / R5-B 未確認\\n- 判定理由（分析上の推論）：全数良否判定と設備フィードバックは本格稼働。実測検査との照合・高精度との報告はあるが、不良の見逃し・流出成果の比較または実測値を確認できない。必要時ドレッシングは2019年の検証計画で、実施・成果の確認とは異なる。\\n- D01 加工対象・設備境界：大泉工場の量産カムシャフト研削。分析単位は個々のカムシャフト。設備型式・砥石・材料・個体差は未知。（K0001, K0002）\\n- D02 劣化・物理現象：設備経年劣化と環境変化によるモデル精度低下を課題とする。砥石の物理的劣化モード・進展・使用限界は未知。（K0001, K0002）\\n- D03 品質・対象イベント：表面粗さ・表面形状等の検査値と品質基準内外の判定。個別の規格値・不良モード別定義・参照検査の詳細は未知。（K0001, K0002）\\n- D04 加工・使用条件：量産工程での運用。加工速度・切込み・負荷・累積加工量・砥石履歴・環境条件の具体値は未知。（K0001, K0002）\\n- D05 データ・観測可能性：設備振動・主軸動力と検査結果。エッジ収集。センサー位置・軸・周波数・母数・欠測・ラベル分布は未知。（K0001, K0002）\\n- D06 信号処理・特徴抽出：振動・動力をモデル学習に用いる。具体的な時間領域統計量、周波数解析、ICA、前処理は未知。（K0001, K0002）\\n- D07 時間構造：加工中に各カムシャフトをリアルタイム判定すると報告。観測窓・判定レイテンシ数値・将来予測ホライズンは未知。（K0001, K0002）\\n- D08 推定・予測モデル：Random Forestによる品質良否判定。推論と検査結果の照合、評価蓄積、チューニング時期判断、再学習・エッジ再展開の運用管理。検証分割・校正・砥石RULは未知。（K0001, K0002）\\n- D09 意思決定・介入：品質基準内外を設備へフィードバックする量産システムを実装。隔離・排出等の具体的動作は未知。必要時ドレッシングは2019年の検証計画で、実際の状態基準への移行は未確認。（K0001, K0002）\\n- D10 評価・経済性：2019/12–2020/12量産実証、2020/8–2021/12運用管理実証、2022/1末本格稼働。高精度との当事者報告。偽陰性率・過検知率・出荷不良分母・実流出率・改善比較・ドレッシング間隔・費用実績は未知。（K0001, K0002）\\n\\n### C02 ジェイテクト：加工後機上の面性状監視\\n\\n- 採択区分：品質推定事例（機上測定システム開発・介入構想）（K0003, K0004）\\n- R1 確認済 / R2 確認済 / R3 確認済 / R4-A 未確認 / R5-A 未確認 / R4-B 未確認 / R5-B 未確認\\n- 判定理由（分析上の推論）：実際に研削した工作物の加工後機上センサー信号なのでR1対象に含むが、加工中の研削接触振動とは区別する。推定性能は実測比較あり。監視・警告値表示を実際の流出阻止または状態基準介入の実績とはみなさない。\\n- D01 加工対象・設備境界：円筒研削盤・定寸装置・追加加速度計・工作物。ドライブピニオン加工への活用例。設備型式・砥石仕様・材料・個体差は未知。（K0003, K0004）\\n- D02 劣化・物理現象：図3はツルーイング直後の少除去量と除去量増加後を比較し後者で面性状が粗くなると報告。摩耗量の直接計測、劣化モードの個別識別、因果機構は未知。（K0003, K0004）\\n- D03 品質・対象イベント：三次元面性状マップ・推定Ra・びびり度・うねり高さ（図5表示例）。上限・警告値（図6）。個別品質規格の数値・不良ラベルは未知。（K0003, K0004）\\n- D04 加工・使用条件：連続研削後、工作物を回転・トラバースさせて計測。除去量増加に伴う面性状を比較。速度・切込み・材料・校正範囲は未知。（K0003, K0004）\\n- D05 データ・観測可能性：定寸装置の変位と先端の追加加速度計の振動をエッジコンピューターへ収集。粗さ実測値を比較。サンプリング周波数・軸・欠測・独立評価母数は未知。（K0003, K0004）\\n- D06 信号処理・特徴抽出：低周波のうねり、高周波の微細面性状の各マップを位相整合・合成。三次元マップから粗さ曲線を算出。ICA利用は未確認。（K0003, K0004）\\n- D07 時間構造：加工後の機上測定・解析・数値化・表示が約10秒。加工ごとの粗さ自動プロットと長期トレンド分析。加工中センシングによる予測ではない。将来ホライズンは未確認。（K0003, K0004）\\n- D08 推定・予測モデル：信号処理による面性状・粗さ推定。学習型ML・劣化推定モデル・RUL・不確実性評価は未確認。（K0003, K0004）\\n- D09 意思決定・介入：操作盤に現在の面性状マップ・数値と選択した過去値（ツルーイング直後等）を表示し、粗さ推移・上限値・警告値から管理余裕を確認。ツルーイング間隔管理の活用構想、自動ツルーイングは今後。実介入・隔離の成果は未確認。（K0003, K0004）\\n- D10 評価・経済性：粗さ推定と実測の相関0.92。図4の差0.05以下は抽出図中文字でµm相当、本文抽出はmmと異なるため単位は暫定読取（画像確認不能）。検査工数・不良・砥石使用数の削減は試算。見逃し率・実介入効果・比較母数・実測費用は未知。（K0003, K0004）\\n\\n### C03 Sauter et al.：研削焼けの多センサー分類\\n\\n- 採択区分：品質推定事例（実加工データ・オフライン検証）（K0005）\\n- R1 確認済 / R2 確認済 / R3 確認済 / R4-A 未確認 / R5-A 未確認 / R4-B 未確認 / R5-B 未確認\\n- 判定理由（分析上の推論）：研削焼けの実測ラベルを使った分類性能を報告するが、実際の不良隔離・流出防止や砥石保全介入は確認できない。\\n- D01 加工対象・設備境界：生産に近い条件で391実加工実験。設備・工作物・砥石の詳細仕様は選択Evidenceに未収集。（K0005）\\n- D02 劣化・物理現象：研削焼けを発生させた実験。分析上、焼けと砥石劣化は同一の対象イベントではない。砥石の寿命・交換限界は未知。（K0005）\\n- D03 品質・対象イベント：ナイタル腐食によるISO14104の4ラベル：A=焼けなし、B=軽度、D=重度、E=再硬化。二値ではAとB/D/Eを区別。量産品質規格・検査誤差は未知。（K0005）\\n- D04 加工・使用条件：生産に近い実加工で焼けを発生。具体加工条件・累積除去量・砥石寿命との関係は選択Evidenceに未収集。（K0005）\\n- D05 データ・観測可能性：AE（テールストック・スピンドル中心）、主軸電流・動力、ナイタル腐食ラベル。391実験、878特徴。動力1特徴は電流subsetに含む。サンプリング数値・欠測は未知。（K0005）\\n- D06 信号処理・特徴抽出：時周波数変換等による特徴抽出と遺伝的プログラミングによる特徴選択器・分類器の探索。全センサー二値モデルは87特徴のkNN。ICA利用は当該実験で未確認。（K0005）\\n- D07 時間構造：研削中の信号から工作物の焼けを判定する技術。実運用時のレイテンシ・オンライン制約・予測ホライズン・RULは未知。（K0005）\\n- D08 推定・予測モデル：二値および4クラス分類。全センサーkNN。訓練データ10-fold CVによるpipeline選択、評価はD10。不確実性校正は未知。（K0005）\\n- D09 意思決定・介入：実加工の信号による焼け検知の検証。実際の追加検査・隔離・排出・停止・砥石交換・ドレッシングへの接続は未確認。（K0005）\\n- D10 評価・経済性：ランダム85:15分割、訓練10-fold CV。二値は正常Aに分割前SMOTE、訓練390/テスト69、全センサー87特徴kNN平均accuracy 99%超（各subsetのaccuracy/balanced accuracy 94%超）。4クラスA/B/D/Eはリサンプリングなし、全センサーkNN約98%（要旨98%超）。両課題で固定random stateの混同行列と100ランダム分割のCV/test分布を評価。混同行列の数値画像未取得のためFN/(TP+FN)は未確認。正常クラス合成と真の焼け見逃し率を区別する。分割前SMOTEによる独立性低下はリスクであり漏洩を確認したわけではない。実生産外部検証、流出防止・介入実績・費用は未確認。（K0005）\\n\\n### C04 湘南サンライズ工業：砥石状態の振動可視化\\n\\n- 採択区分：近接事例（R4-B/R5-Bの定性的成果確認済）（K0006）\\n- R1 確認済 / R2 未確認 / R3 未確認 / R4-A 未確認 / R5-A 未確認 / R4-B 確認済 / R5-B 確認済\\n- 判定理由（分析上の推論）：振動可視化により作業者が砥石状態を判断しドレス回数・加工時間を削減したと報告。品質への影響を課題とするが、信号処理・推定モデルと品質参照との照合は未確認で共通経路を満たさない。R5-Bは定性的実績の存在のみを確認し、改善量・最適化実証とは区別。\\n- D01 加工対象・設備境界：湘南サンライズ工業の超精密金型用エジェクタピン。熟練者が1本ずつ研削。設備・砥石・材料の詳細仕様は未知。（K0006）\\n- D02 劣化・物理現象：県報告は砥石状態悪化が外観傷・寸法不良の要因と説明。具体的摩耗モード、劣化計測・進展則は未知。（K0006）\\n- D03 品質・対象イベント：数µm単位の精度が要求される製品。合格品出来高の低さ、外観傷・寸法不良が課題。具体規格値、品質測定結果・判定性能は未知。（K0006）\\n- D04 加工・使用条件：熟練者が研削。従来は1製品につき複数回ドレス。速度・切込み・負荷・累積加工量は未知。（K0006）\\n- D05 データ・観測可能性：振動センサー・収集Box・PCで状態変化を可視化。振動変化量が小さいとの報告。位置・軸・サンプリング・品質ラベル・標本数・欠測は未知。（K0006）\\n- D06 信号処理・特徴抽出：振動変化の可視化。定量的特徴抽出・FFT・ICA・閾値は未確認。（K0006）\\n- D07 時間構造：砥石状態変化の人による判断支援。観測窓・判断周期・実行時点・将来予測の詳細は未知。（K0006）\\n- D08 推定・予測モデル：振動変化が小さくAIモデル構築には至らず。人の判断を支援。定量的推定性能・RULは未確認。（K0006）\\n- D09 意思決定・介入：振動可視化に基づく状態判断によりドレス回数削減・加工時間短縮につながったとの県報告。具体判断閾値・運用制約・最適化比較・砥石交換実績は未知。（K0006）\\n- D10 評価・経済性：ドレス回数・加工時間の減少は定性的報告。生産効率約20%向上は見込み。実測回数・時間・品質維持・比較設計・母数・経済性は未知。（K0006）\\n\\n### C05 Hanchate et al.：振動の周波数特徴と粗さ推定\\n\\n- 採択区分：品質推定事例（実験・オフライン評価）（K0007）\\n- R1 確認済 / R2 確認済 / R3 確認済 / R4-A 未確認 / R5-A 未確認 / R4-B 未確認 / R5-B 未確認\\n- 判定理由（分析上の推論）：実加工振動から実測Raを回帰し、LIMEで重要帯域を検討した。出荷判定や砥石交換に用いた実績ではない。\\n- D01 加工対象・設備境界：Supertech CNC精密平面研削盤。アルミナ・ビトリファイド砥石、P20鋼28–37 HRC。異なる4日×20試行。設備・砥石の個体差は未知。（K0007）\\n- D02 劣化・物理現象：本事例は粗さ推定であり砥石劣化・摩耗量・進展を直接推定していない。劣化状態・使用限界の情報は未知。（K0007）\\n- D03 品質・対象イベント：各研削パスでMahr粗さ計によるRa 0.06～0.14 µmを参照。品質規格、不良限界・測定不確かさは未知。（K0007）\\n- D04 加工・使用条件：異なる4日で各20試行、80実試行。同一のサンプリング・conditioning設定、砥石速度20.3 m/s。4日を4種の加工条件と断定しない。切込み・加工条件間差の詳細は未収集。（K0007）\\n- D05 データ・観測可能性：テールストッククイルに取り付けた接線方向Y軸加速度計で160 kHz収集、各run約6.5秒、80実試行・各研削パスの実測Ra。64画像を訓練、16画像をvalidation/testing（出版社版はtesting、原稿は独立Reviewer確認）。日・砥石単位の分離、拡張前分割、validation/testing・モデル選択の独立性は未確認。欠測等未知。（K0007）\\n- D06 信号処理・特徴抽出：スペクトログラム・画像拡張をCNNに入力（画像拡張は実試行追加ではない）。LIMEで11.7～19.1 kHzをモデル重要帯域と評価。元160 kHzのスペクトログラムから周波数方向に切り出し30/20/10/5 kHz相当のCNNを評価。実低レート再収集による独立試験とは異なる。ICA利用は未確認。（K0007）\\n- D07 時間構造：研削パスごとの振動と粗さを対応させる。約6.5秒/run。実運用判定周期・レイテンシ・予測ホライズンは未知。（K0007）\\n- D08 推定・予測モデル：CNN回帰、LIMEによるモデル説明。LIME寄与は物理因果を証明しない。独立したモデル選択・校正やRULは未確認。（K0007）\\n- D09 意思決定・介入：粗さ推定・センサー帯域設計の検討。追加検査・隔離・排出・停止・ドレッシング判断を実施した報告なし。（K0007）\\n- D10 評価・経済性：160 kHzモデル全体R² 0.95、訓練0.99、テスト0.81。30 kHz相当の周波数切り出し評価は全体R² 0.93であり独立テストR²とは異なる。小標本、日・砥石を跨ぐ評価、画像拡張の分割・validation/testing独立性が未確認。量産外部妥当性・見逃し率・流出・経済成果は未知。原稿PDF直接再取得は失敗、検索抽出・出版社版・Reviewer確認の区別はK0007参照。（K0007）\\n\\n### C06 Chao et al.：AE分類によるドレッシング基準\\n\\n- 採択区分：近接事例（劣化・品質限界の関連を実験で検証）（K0008）\\n- R1 確認済 / R2 確認済 / R3 未確認 / R4-A 未確認 / R5-A 未確認 / R4-B 未確認 / R5-B 未確認\\n- 判定理由（分析上の推論）：砥石状態のマルチラベル推定と実測Raの時間的対応は確認。品質を直接推定した値・品質代理指標としての独立した判定性能は示されないためR3を保守的に未確認。5区間持続ルールは連続実験に基づく提案で、閾値・移動窓の同一データ内感度分析も行われているが、実介入・成果比較は未確認。\\n- D01 加工対象・設備境界：WA46砥石・S45C工作物の平面連続研削実験。設備・砥石個体差は未知。（K0008）\\n- D02 劣化・物理現象：切りくず除去、自生発刃、目詰まり、鈍化の共存を扱う。目詰まり・鈍化の持続とRaの回復不能を対応づける。砥粒破砕による高周波成分と自生発刃検知性能の関連は著者仮説。（K0008）\\n- D03 品質・対象イベント：砥粒光学観察の物理状態ラベル、各区間後の実測Ra、0.4 µmの目標境界。顧客品質規格との一致・不良ラベルとの対応は未確認。（K0008）\\n- D04 加工・使用条件：累積除去量0.6 mmごとの8区間、総4.8 mm。具体速度・切込み・環境条件は未収集。（K0008）\\n- D05 データ・観測可能性：AEサンプリング200 kHz（RMSEによる信号安定性評価で選定）。接触区間960セグメント、砥粒光学観察、区間後の実測Ra。自生発刃の砥粒破砕高周波成分が収集帯域を超える可能性。センサー位置・欠測等は未収集。（K0008）\\n- D06 信号処理・特徴抽出：AE接触区間を切り出しSTFT・正規化・画像化。区間別の状態推定結果を集計し、劣化indexを移動平均で評価。ICA利用は未確認。（K0008）\\n- D07 時間構造：0.6 mmごとの連続8区間。第7区間以降Raが目標範囲に回復しないとの報告。元の判断則は劣化の5区間以上連続、感度分析はW=3/5/7。将来限界到達時点・RULの定量予測は未確認。（K0008）\\n- D08 推定・予測モデル：光学観察ラベルを用いたResNetの4物理状態マルチラベル分類。自生発刃で相対的に低いAUCの一因としてAE帯域制約の可能性を著者が指摘。Ra直接推定の性能・品質代理判定の独立検証・RULは未確認。（K0008）\\n- D09 意思決定・介入：元のルール：目詰まりと鈍化（自生発刃併発含む）の5区間以上持続で即ドレッシングを提案。式(8)–(10)では両者の出現比率和D(t)のW区間移動平均>θかつRa>0.4 µm。後者は感度分析用の代替的定式化で元の5区間ルールを置き換えない。別データ・実介入・交換時期最適化の比較は未確認。（K0008）\\n- D10 評価・経済性：macro F1約0.80・AUC 0.73～0.81は砥石状態分類。第7区間以降のRa回復不能は連続研削実験。同一データ内の判断時点感度（θ=0.5/0.6/0.7、W=3/5/7）は高θ・大Wで遅延、大Wで安定、小Wで速いが短期変動に敏感、低θで過剰ドレスリスク。トリガー変動は1区間以内との著者報告。独立した外部検証・実介入比較ではなく、品質維持・交換頻度・費用最適化の成果は未確認。（K0008）\\n\\n## ユースケース構築への示唆（分析上の推論）\\n\\n1. 品質保証A：加工中の振動・動力等を工作物IDと結合し、粗さ・形状・研削焼け等の独立検査値でラベル付け。品質判定を設備へ伝え、追加検査や隔離等の具体的動作を規定し、真の不良品を分母とする偽陰性率と実流出率を分ける。C01は実装、C02は機上計測、C03/C05は特徴抽出と品質推定の参照となる。ただしC03では二値の分割前SMOTEと4クラスの非リサンプリング評価を分け、見逃し率はaccuracyから推定しない。C05では日・砥石単位分割とvalidation/testingの独立性を確保する。\\n2. 状態基準保全B：砥石使用履歴・介入ログと信号を結合し、状態閾値または持続性を使う。C04は人の判断支援、C06は物理状態と品質限界を関連づけた基準と同一データ内の閾値・観測窓感度評価であり、実介入比較ではない。ドレッシングと砥石交換は異なるリセット・コストを持つ。介入時期の最適化を主張するには、安全な品質制約のもとで既存定期ルールと比較し、品質不良・工具使用量・時間・費用を別々に測る必要がある。\\n3. 振動の時間領域統計・FFTは基準モデルとして検討し、時周波数解析・CNNなど高度な方法と同一の検証分割で比較する。ICAは探索候補であって採択集合で利用を確認した手法ではない。LIMEの特徴寄与を物理的因果と同一視しない。既存の高サンプリング信号のスペクトル切り出しによる帯域評価と、実低レート収集による独立試験を区別する。実生産適用時は砥石・材料・設備・時間をまたぐ独立検証、ドリフト検知、再校正を設計する。\\n\\n## 探索・選択境界\\n\\n日英で研削加工、振動、表面粗さ、研削焼け、品質保証、砥石摩耗、ドレッシング、交換時期、ICA、grinding / vibration / acoustic emission / surface roughness / grinding burn / wheel wear / dressing timing / independent component analysis 等の組合せを探索した。研削加工以外のみ、一般的設備故障検知、品質・劣化と関連しない信号処理、シミュレーションのみは選択対象外。公開原典7件を直接検討し、量産実装、開発、実加工検証、現場可視化、状態基準提案の差異を捉える代表的集合として区切った。ICA固有の実研削事例、実測の流出低減・交換最適化比較は未確認で追加探索余地あり。検索全件・独立スクリーニングを行ったsystematic reviewではない。原典PDFの図表画像は再取得できず、抽出テキストを利用した。C02図4の差の単位は暫定読取、C03混同行列の数値は未確認。C05は原稿の直接取得がタイムアウトしたため、検索抽出（異なる4日・80実試行・30 kHz相当R²等）、出版社版（64/16分割等）、独立Review 000001 F002の原稿確認記録（validation/testing）を区別した。\\n\\n## Key Judgments\\n\\n- 採択6件中、品質推定事例4件、近接2件。統合型・品質保証型・状態基準保全型の全条件を満たす事例は未確認。\\n- C01は量産品質判定Aの意思決定実装を確認するがR5-A未確認。C04の定性的なドレス回数・時間低減はB介入成果を支持するが共通品質推定経路は未確認。\\n- C06の劣化分類と粗さの対応は品質代理の候補であり、元の5区間持続ルールに対する同一実験データ内の閾値・移動窓感度評価もある。ただし品質推定の独立検証・実介入・最適化成果は未確認。\\n\\n## Limitations\\n\\n- 7資料・6事例を探索的に選択。報告の存在と因果・再現性・量産展開を分ける。検索全件・独立スクリーニングなし。PDF図表画像の再取得は失敗し、C02の差0.05の単位は暫定読取。C05原稿PDF直接取得はタイムアウトし、原稿検索抽出・出版社版・独立Reviewerによる原稿確認記録を区別した。\\n- C03二値は正常Aの分割前SMOTEを伴い、4クラスにはSMOTEなし。混同行列数値画像未取得のため焼け偽陰性率は未確認。分割前SMOTEは独立性を損なうリスクであり漏洩の確証はない。\\n- C05は異なる4日80実試行、64/16画像分割の小標本。日・砥石単位分割、画像拡張前分割、validation/testingとモデル選択の独立性は未確認。30 kHz相当は周波数切り出しであり実収集による独立試験ではなく、全体R²とテストR²を区別する。\\n- C06のθ/W感度分析は同一実験データ内の判断時点評価であり、別条件での検証・実介入・経済最適化ではない。200 kHz収集帯域が自生発刃の高周波成分を捉えきれない可能性もある。\\n\\n## Unresolved Questions\\n\\n- C01でドレッシング間隔延伸の実測成果と不良流出率が追加公開されているか。\\n- C02で実際のツルーイング介入・工具費・品質維持を比較した量産事例があるか。\\n- ICAによる実研削品質推定を検証した原著があるか。\\n- C06の状態代理指標について独立検証・介入前後比較があるか。\\n- C03のFig.8/10から焼け見逃し率を算出できるか、分割前SMOTEの独立性を確認できるか。\\n- C05のvalidation/testingとモデル選択・拡張前分割の独立性、日・砥石単位の外部妥当性はどうか。\\n- C06の閾値・窓サイズの感度評価は別条件・別データでも成立し、実介入で品質維持・費用効果を示せるか。\\n\\n## Alternative Interpretations\\n\\n- C06では劣化予測とRa実測の時間的対応を品質代理評価と広く読む余地がある。しかし独立した品質推定値・判定性能は未確認で、本分析ではR3の保守的判定を維持する。\\n- C04の振動可視化は広義の人間参加型状態推定とみなせるが、特徴抽出・閾値・品質照合の記載が不足するためR2とR3を未確認とする。\"")
