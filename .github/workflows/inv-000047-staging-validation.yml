name: Validate INV-000047 staging
on:
  push:
    branches: ['validation/inv-000047']
    paths:
      - '.github/workflows/inv-000047-staging-validation.yml'
      - 'investigations/INV-000047/**'
      - 'information_sources/**'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'jsonschema>=4.18'
      - name: Validate available canonical stages in order
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          for n in 305 306 307 308 309 310 311 312; do
            sid=$(printf 'SRC-%06d' "$n")
            python -m research_atelier.validation.validate_information_source "$sid"
          done
          id=INV-000047
          python -m research_atelier.validation.validate_investigation "$id" --through 00 --new-freeze
          for stage in 10 20 30; do
            case "$stage" in
              10) file=10_evidence.json ;;
              20) file=20_synthesis.json ;;
              30) file=30_analysis.json ;;
            esac
            if [ -f "investigations/$id/$file" ]; then
              python -m research_atelier.validation.validate_investigation "$id" --through "$stage"
            fi
          done
      - name: Validate promoted canonical chain and derive review request
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          git checkout --detach origin/main
          test "$(git rev-parse HEAD)" = f1917022ff128b87240d7e8a6d414f8f6dbfcb7c
          test ! -d investigations/INV-000047/reviews
          python -m research_atelier.validation.validate_investigation INV-000047 --through 30
          python - <<'PY'
          import json
          from pathlib import Path
          from research_atelier.reviewing.reconcile import reconcile_payload
          context = json.loads(Path('investigations/INV-000047/00_context.json').read_text())
          payload = {'current': {'review_status': '未', 'latest_review_seq': None}, 'context': context, 'review': {'latest': None, 'target_relation': 'missing', 'issues': []}, 'events': {'review_requested': True}}
          result = reconcile_payload(payload)
          print('RECONCILE_RESULT=' + json.dumps(result, ensure_ascii=False))
          assert result['outcome'] == 'UPDATE' and not result['issues']
          PY
