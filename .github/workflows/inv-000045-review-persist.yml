name: INV-000045 canonical review persistence audit
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4ec1db4855cef6a4f12e9875b2c754f96018b879
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'jsonschema>=4.18'
      - name: Run canonical writer and history/projection helpers
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          from datetime import datetime, timezone
          from dataclasses import asdict
          from research_atelier.reviewing.review_writer import prepare_review_cycle, save_review_cycle, EXPECTED_ARTIFACTS
          from research_atelier.reviewing.review_state import load_review_history, target_relation_from_blobs
          from research_atelier.projection.review import plan_review_projection
          from research_atelier.reviewing.reconcile import reconcile_payload
          def git(*args):
              return subprocess.check_output(["git",*args],text=True).strip()
          p=Path("investigations/INV-000045")
          target="4ec1db4855cef6a4f12e9875b2c754f96018b879"
          expected={"00_context":"fe78ff9e72984db707391a6671f192595567481b","10_evidence":"2cda402483103dc09226919da22d34fd33145752","20_synthesis":"a8f38cc1192fd6412fd1edd991f5720a8882afce","30_analysis":"4a8b0632a49130c6d7f34999b5f89e6c163f2693"}
          def blobs(ref): return {x:git("rev-parse",f"{ref}:{p}/{x}.json") for x in EXPECTED_ARTIFACTS}
          assert git("rev-parse","HEAD")==target and blobs("HEAD")==expected
          prepared=prepare_review_cycle("INV-000045",review_dir=p/"reviews",schema_path="schemas/v2",target_commit_sha=target,artifact_blob_shas=expected)
          assert prepared.review_seq==1
          layers=json.loads("{\"00_context\":{\"assessment\":\"RQ・Scope・AssumptionsとExploratoryの対応は妥当。網羅的探索の終了条件は未定だが、既存Context内の探索設計で対処できる。Context-defining defectは認めない。\",\"findings\":[]},\"10_evidence\":{\"assessment\":\"7 Source revisionと14 Evidence、参照された5 Evidence Noteを照合。SRC-000172著者版、SRC-000186公開目次・序文、SRC-000217/218/250出版社資料、SRC-000177著者版abstractを確認。MetroPTは出版社の直接全文取得制約があり、著者preprintと検索索引・EV-000364で主要な内容を照合したが、出版版のFMEA/FMECAとGPSゼロ符号化の細部は独立確認未完。ISO規範本文は対象外。確認可能な範囲で主要な記述は概ね整合する一方、既存SourceとNoteにあるRQ関連情報の選択欠落を認める。\",\"findings\":[{\"severity\":\"Moderate\",\"target\":\"E0008 / E0013 → 運用条件・評価要求\",\"evidence\":[\"SRC-000218 https://doi.org/10.3390/info17060523 §6.2, §7: リードタイム、許容アラーム負荷、計算資源、誤報・見逃しの非対称な損失と安全上の制約を論じる。具体的なコストベース評価は未実施。\",\"EV-000343 https://app.notion.com/p/410e5855be3981ea9209dd7f919dbdcb: PR/ROC、誤報負荷、統計検定の未実施を記録しているがE0008に欠落。\",\"20_synthesis U0004; 30_analysis evidence_gaps, J0009/J0010\"],\"impact\":\"既存資料で候補として支持される運用上の属性が根拠不足として除外される。F1の解釈上の制約も失われる。\",\"repair_direction\":{\"mode\":\"same_investigation\",\"affected_layer\":\"10_evidence\",\"instruction\":\"既存Sourceから運用制約と評価上のlimitationを追加captureし、著者の提案と実証結果、候補の存在と定量化の可否を区別する。\"}},{\"severity\":\"Moderate\",\"target\":\"E0007 → 予測出力・観測条件\",\"evidence\":[\"SRC-000217 https://doi.org/10.3390/s26061915 Abstract, §4.1.2, §5.4: RUL分布、risk ranking、静的・時間依存共変量、観測可能性、fleet heterogeneity、意思決定別出力を整理。\",\"EV-000342 https://app.notion.com/p/410e5855be39810e8bb4d9deb19fccbc: risk ranking記述がE0007に欠落。\",\"30_analysis J0007/J0008、Working Answer第7/8領域\"],\"impact\":\"代表的な予後出力と事例間の観測条件の差が分類案に明示されない。\",\"repair_direction\":{\"mode\":\"same_investigation\",\"affected_layer\":\"10_evidence\",\"instruction\":\"RUL分布・要約、risk ranking、期間内故障確率の区別、共変量と観測可能性・対象群の異質性を既存Sourceからcaptureする。\"}},{\"severity\":\"Moderate\",\"target\":\"10_evidence sources / frozen scopeのcoverage\",\"evidence\":[\"00_context: 設備・業界・手法を限定しない網羅的探索。\",\"10_evidence: 7件は産業・時系列中心。20_synthesis U0002、30_analysis limitations: 体系的探索の飽和未検証。\",\"SRC-000172 https://ar5iv.labs.arxiv.org/html/2002.04236 §1–2: 時系列異常検知の適用領域は産業に限定されない。\"],\"impact\":\"限定された探索で候補分類を構築しているため、非産業・非時系列等の属性が十分に探索されない。網羅性未確立の明記は適切だが、Scopeに対する探索不足は残る。\",\"repair_direction\":{\"mode\":\"same_investigation\",\"affected_layer\":\"10_evidence\",\"instruction\":\"既存Contextのまま異なるデータ形態・用途・設備・運用条件を意図的に比較するsource selectionを追加し、探索範囲、選択基準、未探索領域、終了条件を記録する。\"}}]},\"20_synthesis\":{\"assessment\":\"14 Knowledge Unit、7 Relation、4 UncertaintyをEvidenceと照合。概ねsource-boundaryを保持し、アラームと故障の区別、ISO公開範囲、網羅性未検証を明示している。Evidenceの選択欠落をSynthesisで補完してはならない。固有の追加Findingは認めないが、上流repair後に再構築する。\",\"findings\":[]},\"30_analysis\":{\"assessment\":\"Exploratory profileはpatterns・candidate_hypotheses・anomalies・evidence_gapsを含み、仮説を確立済み因果結論としていない。10領域は候補として明示され、普遍性・網羅性・独立性の未確立を適切に限定する。一方、共通・主に故障予測の割当根拠と分類領域の意味境界に独立した欠陥がある。\",\"findings\":[{\"severity\":\"Moderate\",\"target\":\"J0001–J0010 / Working Answer: 共通・主に故障予測の分類\",\"evidence\":[\"00_context significance: 共通および固有ファクター同定。\",\"J0002/J0006/J0008: 主に故障予測と分類するが、K0004–K0008等は異常検知における相対的重要性を比較していない。\",\"J0003/J0009にも警報・停止・故障イベント属性が現れる。\"],\"impact\":\"適用可能性と相対的重要性・タスク固有性が混同され、分類の判定根拠が不足する。\",\"repair_direction\":{\"mode\":\"same_investigation\",\"affected_layer\":\"30_analysis\",\"instruction\":\"概念上の適用可能性、タスク定義上の必要性、経験的頻度を区別し、共通・固有・未確定の判定基準と根拠を示す。追加Evidenceが必要なら上流でcaptureする。\"}},{\"severity\":\"Minor\",\"target\":\"J0002/J0006/J0008/J0009/J0010: 分類領域の重複\",\"evidence\":[\"J0002/J0009: 警報・停止閾値、J0006/J0009: 必要リードタイム、J0008/J0010: 予後信頼度。\",\"alternative_interpretationsは別層別案を示すが、重複属性の扱いを定義しない。\"],\"impact\":\"分類案を記述テンプレートとして用いる場合、重複記録や比較時の解釈不一致が生じ得る。\",\"repair_direction\":{\"mode\":\"same_investigation\",\"affected_layer\":\"30_analysis\",\"instruction\":\"各領域のsemantic boundaryと重複属性の参照関係を明示する。相互排他的分類を強制しない。\"}}]}}")
          git("fetch","origin","main")
          current=git("rev-parse","FETCH_HEAD")
          assert current==target and blobs(current)==expected
          manifest=save_review_cycle(prepared,reviewed_at=datetime.now(timezone.utc).isoformat(),layer_bodies=layers,current_target_commit_sha=current,current_artifact_blob_shas=blobs(current),review_dir=p/"reviews",schema_path="schemas/v2")
          h=load_review_history("INV-000045",review_dir=p/"reviews",schema_path="schemas/v2")
          assert not h.issues and len(h.records)==1
          latest=h.records[-1]
          for f in sorted((p/"reviews").glob("*.json")):
              print("REVIEW_FILE "+json.dumps({"path":str(f),"content":f.read_text()},ensure_ascii=False))
          print("REVIEW_HISTORY_PASS")
          print("PROJECTION_PLAN "+json.dumps(asdict(plan_review_projection(latest,investigation_rows=[{"investigation_id":"INV-000045","url":"https://app.notion.com/p/423e5855be3981bf860dd41a5c62d8e4"}],existing_review_rows=[])),ensure_ascii=False))
          print("RECONCILE_PLAN "+json.dumps(reconcile_payload({"context":json.loads((p/"00_context.json").read_text()),"current":{},"review":{"latest":latest,"issues":list(h.issues),"target_relation":"exact"}}),ensure_ascii=False))
          
          PY
