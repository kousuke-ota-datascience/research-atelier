name: Validate EOL Investigations 000042 000043
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/eol-investigations-validation.yml'
      - 'investigations/INV-000042/**'
      - 'investigations/INV-000043/**'
      - 'information_sources/SRC-0002**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'jsonschema>=4.18'
      - name: Verify both canonical EOL investigation chains
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          for id in INV-000042 INV-000043; do
            python -m research_atelier.validation.validate_investigation "$id" --through 00 --new-freeze
            python -m research_atelier.validation.validate_investigation "$id" --through 10
            python -m research_atelier.validation.validate_investigation "$id" --through 20
            python -m research_atelier.validation.validate_investigation "$id" --through 30
          done
      - name: Validate accepted Working Answer projection provenance
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker
          schema = json.loads(Path('schemas/v2/projection_log.schema.json').read_text())
          validator = Draft202012Validator(schema, format_checker=FormatChecker())
          for inv, rq in (('INV-000042', 'RQ-000041'), ('INV-000043', 'RQ-000042')):
              base = Path('investigations') / inv
              log = json.loads((base / 'projection_log_v2.json').read_text())
              validator.validate(log)
              assert log['result'] == 'SUCCESS'
              assert log['rq_id'] == rq
              assert log['source_investigation_id'] == inv
              assert log['projection_target'] == {'surface': 'page_body', 'section_heading': '# Working Answer'}
              file_path = f'investigations/{inv}/30_analysis.json'
              pinned = subprocess.check_output(['git', 'show', log['source_30_analysis_commit_sha'] + ':' + file_path], text=True)
              current = (base / '30_analysis.json').read_text()
              if pinned == current:
                  print('PASS', inv, 'projection provenance CURRENT')
              else:
                  reviews = sorted((base / 'reviews').glob('review-[0-9][0-9][0-9][0-9][0-9][0-9].json'))
                  assert reviews, 'stale projection without canonical Review'
                  latest = json.loads(reviews[-1].read_text())
                  assert latest['investigation_id'] == inv
                  assert latest['verdict'] == 'FINDINGS', 'a PASS Review requires current accepted Working Answer projection'
                  current_blob = subprocess.check_output(['git', 'hash-object', file_path], text=True).strip()
                  assert latest['target']['artifact_blob_shas']['30_analysis'] != current_blob, 'cannot allow stale projection without actual repair'
                  print('STALE', inv, 'prior Working Answer; newest semantic Review remains FINDINGS')
          PY
      - name: Verify canonical Review-state transition for both repaired Investigations
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          from research_atelier.reviewing.reconcile import reconcile_payload
          for inv in ('INV-000042', 'INV-000043'):
              base = Path('investigations') / inv
              context = json.loads((base / '00_context.json').read_text())
              reviews = sorted((base / 'reviews').glob('review-[0-9][0-9][0-9][0-9][0-9][0-9].json'))
              assert reviews
              manifest = json.loads(reviews[-1].read_text())
              assert manifest['verdict'] == 'FINDINGS'
              current_blob = subprocess.check_output(['git', 'hash-object', str(base / '10_evidence.json')], text=True).strip()
              assert manifest['target']['artifact_blob_shas']['10_evidence'] != current_blob
              for old_status in ('要修正', '再レビュー待'):
                  outcome = reconcile_payload({
                      'current': {'review_status': old_status, 'latest_review_seq': manifest['review_seq']},
                      'review': {'latest': manifest, 'target_relation': 'stale', 'issues': []},
                      'context': context,
                      'events': {}
                  })
                  assert not outcome['issues'], outcome
                  expected = ('UPDATE', {'Review Status': '再レビュー待'}) if old_status == '要修正' else ('NOOP', {})
                  assert (outcome['outcome'], outcome['changes']) == expected, outcome
              print('PASS stale Review-state reconciliation:', inv)
          PY
