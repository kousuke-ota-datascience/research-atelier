name: INV-000046 derived case assessments validation
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'jsonschema>=4.18'
      - run: python -m unittest discover -s tools/case_assessments -p 'test_*.py'
      - run: |
          python tools/case_assessments/build.py INV-000046 --check
          python - <<'PY'
          import json, hashlib
          from pathlib import Path
          p=Path('investigations/INV-000046/derived/case_assessments.json')
          raw=p.read_bytes()
          d=json.loads(raw)
          assert hashlib.sha256(raw).hexdigest()=='4aa370eea3786b6b769357540536ecd2734dc0b604ca4d6cab2b42616fd75a1b'
          assert d['summary']['case_count']==11
          assert d['summary']['factor_assessment_count']==429
          assert d['summary']['criterion_assessment_count']==44
          assert d['derived_from']['review_seq']==5
          print('PERSISTED_DERIVATIVE_SHA256 '+hashlib.sha256(raw).hexdigest())
          PY
