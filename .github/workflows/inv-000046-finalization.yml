name: INV-000046 reviewed finalization
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'jsonschema>=4.18'
      - run: PYTHONPATH=src python -m research_atelier.validation.validate_investigation INV-000046 --through 30
      - run: |
          PYTHONPATH=src python - <<'PY'
          import json, subprocess, datetime
          from pathlib import Path
          from research_atelier.projection.working_answer import working_answer_projection_state, build_projection_log_v2
          b=Path('investigations/INV-000046')
          a=json.loads((b/'30_analysis.json').read_text())
          r=json.loads((b/'reviews/review-000005.json').read_text())
          assert r['verdict']=='PASS'
          assert all(subprocess.check_output(['git','hash-object',str(b/(k+'.json'))],text=True).strip()==v for k,v in r['target']['artifact_blob_shas'].items())
          body="# Working Answer\n\n## Answer\n\n### 結論と採択判定\n\nfrozen Contextの4条件：R1=明示的な将来故障・機能喪失又は故障代理イベントの予測、R2=稼働データと定期的な運転員・点検・整備記録の同一用途での実利用（入力・ラベル・意思決定の役割を区別。稼働データが日報内にあってもよい）、R3=予測結果に基づく故障前保全計画、R4=従来保全比の実績総メンテナンスコスト削減報告。確認済=当該事例について原典が条件を報告（独立検証・因果確立ではない）、不適合=明示されたタスク・費用等が条件外、未確認=資料不足又は条件の一部しか確定しない。R3は早期警報と保全の連携だけでは未来故障予測との接続を認定しない。R4は総保全費を明示する前後報告を確認済とするが、費目・比較期間・分母・交絡は別に留保する。総範囲不明の整備費報告、広義費用、試算、目標は同一視しない。\n\n完全適合0件、近接10件（各条件の一部を扱う候補で、不適合条件があるものも含む）、除外1件（C11故障後復旧支援）。この選択範囲での判断であり、該当事例が存在しないことを示さない。全事例の4条件別判定は各C節に記載する。条件ごとの有力な参照先は、R1・R3=Quantzig（RUL・故障確率、保全計画者向け推奨と先行修理、ただしベンダー索引報告）、R2=iFactory（シフト記録に稼働測定を含み通知・作業依頼に使用）、R4=LEF2-200（総保全費28%減の原著前後報告、遮光との寄与分離不能）。逆浸透設備は予測・警報・診断・介入・前後評価の設計を具体的に記述するが、警報条件には故障確率の持続上昇も記載されるが、確率の定義・個別実装・校正、未来振動の物理故障代理性、定期記録の予測・計画利用、実績総保全費は未確認。OLIは金型機械故障をTEとするリスク推定・費用目的の閾値最適化を確認したが、判断時点以後の予後出力としての定義及び実保全・実績費用は確認できない。単一の総合順位は付与しない。\n\n### 探索経路、選択境界と終了理由\n\n日本語・英語の公開原著、実証報告、導入企業・技術提供企業報告を、故障予測／predictive maintenance、日報／operator logs／shift logbook／inspection records、保全費／maintenance cost等の組合せで探索した。従前の8候補の処理は、富山市→C03、米空軍→C08（B-1B SBA個別導入へ限定、PANDA一般・DIU集約報告は背景情報）、逆浸透→C07、射出成形の年検査費23万→9万ドル推定候補→選択外、オムロン→C04、MDTI→C05、Quantzig→C09、JFE→C11（除外）とした。追加候補は運転員記録・保全費関連検索からC01、B-DASH日本語実証報告検索からC02、shift logbook関連検索からC06、射出成形関連検索からC10。先行射出成形候補は再探索（injection molding predictive maintenance \"\\$230,000\" \"\\$90,000\" inspection cost）で An Unsupervised Learning Model for Intelligent Machine-Failure Prediction With Heterogeneous Sensors（DOI 10.1155/int/3346341）の索引表に対応することを確認した。OLI原著とは別資料。推定検査費で実績総保全費ではなく、本文直接取得不能のため候補スクリーニング記録にとどめ、選択12 Sourceには含めない。特許は登録したが本文未取得で選択外。\n\nReview 000001の再作業では、frozen cutoff以前の既選択原典に対してreviewの参照URL・指摘箇所（印刷原著、B-DASH No.40、iFactory、逆浸透原著、[C3.ai](http://C3.ai) SBA、Quantzig、OLI）を再取得し、必要箇所を追加抽出した。Quantzigは site:[quantzig.com/case-studies/manufacturing-predictive-maintenance](http://quantzig.com/case-studies/manufacturing-predictive-maintenance) \"maintenance planners\" \"work orders\"、OLIは \"Using Intelligent Edge Devices for Predictive Maintenance on Injection Molds\" \"setup\" \"excluded\" などで公開元索引を補足したが、直接全文再取得は依然不能。検索の全クエリ・ヒット件数・除外全文履歴は初回から完全には保存されていない。再作業はレビュー指摘の原典情報補足・判定境界修正を実施し、追加検索が必要な属性を未知として残す段階で終了。体系的レビュー、網羅性、探索飽和を主張しない。Review 000002ではSRC-000250の公式HTML §3.2–3.5・§4.2・Tables 7–8,14を再取得し、SRC-000303は公式URLへの直接取得が429で失敗したため公開元索引本文（論文名と Isolation Forest / 80% / 0.01 / 0.50 を組み合わせた検索、§4・§5.1–5.2・§6）を参照して追加抽出。C06の推論周期も原典検索結果と既存Evidenceを区別して再確認したが、予測・判定処理固有の周期を確定できなかった。原典の明示内容を追加し、未確認の故障確率実装・未来条件付き確率・比較独立性を留保した。選択12 Source、76 Evidence、46 Knowledge Unitを使用した。\n\n航空機の境界：PANDA一般の整備履歴に基づく故障予測（K0018）、[C3.ai](http://C3.ai)全体の監視1,000超部品・採点警報accuracy92%・分析時間最大85%短縮（K0020）、DIUの2019年移行報告における空軍優先サブシステムの予定外整備40%減・陸軍の重大飛行中故障24%減（K0021）は背景情報で、B-1B SBA固有の性能・成果・母数には転用しない。独立導入単位を確認できないため別事例数にも加えない。\n\n### 全39軸の事例比較\n\n定義はRQ-000044（INV-000045の固定30\\_analysis revision）を使用。11事例×39軸=429枠を維持。Review 000002ではC07/C10の関連軸と4採択条件を再評価し、全11事例のD06.2/D08.3を横断照合した。該当・原典報告=当該属性の報告（部分既知・値不明を本文に記載）、該当・分析上の推論=解釈を明示、未知=適用可否又は値が根拠から確定しない、非該当=当該タスクの定義上対象外。複数機能ではサブタスク別に適用を分ける。属性ごとに根拠Kまたは未知を判断した確認範囲を併記する。記録周期・処理周期、故障率・観測件数、故障の真値・警報閾値、未来信号予測・故障予測、要求リードタイム・実測遅延、損失影響度・誤判定損失、費用推定・実績を混同しない。\n\n### C01 Roland LEF2-200 デジタル印刷設備（SRC-000298）\n\n近接事例。根拠範囲：K0004、K0005、K0006、K0007、K0027。\n\nR1［未確認］閾値接近警報は確認。将来故障事象の目的変数・時点は不明（K0005、K0006）<br />R2［未確認］センサーと運転員記録の収集は確認。記録の定期性・具体的利用は不明（K0005）<br />R3［未確認］早期警報から予防清掃・交換は確認。明示的未来故障予測に基づく計画か不明（K0006）<br />R4［確認済］著者が導入前後の総保全費28%減を報告。費目・期間・母数不明、遮光との寄与分離不能（K0007、K0027）\n\nD01.1 対象設備・境界［該当・原典報告］LEF2-200印刷機（根拠：K0004）<br />D01.2 対象個体・規模［該当・原典報告］3機種のサービス報告100件から1機種選択。実装台数未知（根拠：K0004）<br />D01.3 異質性［該当・原典報告］3機種の故障報告構成が異なる（根拠：K0004）\n\nD02.1 故障モード［該当・原典報告］LEF2-200のヘッド詰まり。3機種集計にはフィルタ詰まり、エンコーダ損傷、印刷ずれ、空気混入（根拠：K0004、K0027）<br />D02.2 開始・進展・影響因子［該当・原典報告］反射性基材からのUV反射がインク乾燥・ヘッド詰まりを促すとの説明（根拠：K0027）<br />D02.3 事象頻度・率［未知］報告構成比は発生率ではなく、曝露量・故障率は不明（確認範囲：K0004）<br />D02.4 重症度［未知］重大故障の重症度基準不明（確認範囲：K0007）<br />D02.5 物理的予兆［未知］乾燥・詰まり機構は報告。故障前の測定可能な物理変化と故障時点との対応は不明（確認範囲：K0006、K0027）\n\nD03.1 対象イベント・判定・正解単位［未知］サービス報告・教師あり手法は記述されるが目的変数・真値判定規則・正解単位不明（確認範囲：K0004、K0005）<br />D03.2 正常・許容［未知］選択した根拠範囲から属性値又は適用可否を確認できない（確認範囲：K0004、K0005、K0006、K0007、K0027）<br />D03.3 例外・除外［未知］選択した根拠範囲から属性値又は適用可否を確認できない（確認範囲：K0004、K0005、K0006、K0007、K0027）<br />D03.4 将来故障／代理イベント［未知］閾値接近は現在状態の警報。未来故障イベントの明示的定義不明（確認範囲：K0006）<br />D03.5 事象間関係［該当・原典報告］警報後に予防清掃・交換。遮光も実施。防止件数は著者の説明で観測真値ではない（根拠：K0006、K0007、K0027）\n\nD04.1 運転モード・負荷［未知］選択した根拠範囲から属性値又は適用可否を確認できない（確認範囲：K0004、K0005、K0006、K0007、K0027）<br />D04.2 累積稼働・環境［該当・原典報告］基材の反射条件と周囲温度を扱う（根拠：K0006、K0027）<br />D04.3 未来条件シナリオ［未知］選択した根拠範囲から属性値又は適用可否を確認できない（確認範囲：K0004、K0005、K0006、K0007、K0027）\n\nD05.1 データ・変数［該当・原典報告］振動・温度・電気負荷、運転員記録。実装はインク流量・基材反射率・周囲温度、特徴候補は詰まり頻度・閉塞・温度変動・ヘッドエラー（根拠：K0005、K0006）<br />D05.2 頻度・粒度・履歴［該当・原典報告］継続監視。観測間隔・記録周期・欠測・結合方法は不明（根拠：K0005、K0006）<br />D05.3 観測可能性・ラベル源［該当・原典報告］サービス報告100件、機種別LEF2-200構成38%。3機種故障種別構成：ヘッド15%、フィルタ12%、エンコーダ10%、ずれ9%、空気混入8%。ラベル規則不明（根拠：K0004、K0005）<br />D05.4 観測境界・打切り［未知］選択した根拠範囲から属性値又は適用可否を確認できない（確認範囲：K0004、K0005、K0006、K0007、K0027）<br />D05.5 データ生成過程［該当・原典報告］サービス報告とセンサー・運転員記録による調査、実装報告（根拠：K0004、K0005、K0006）<br />D05.6 段階別ラベル［該当・原典報告］教師あり学習とtest dataset評価の記述。各段階のラベル規則・件数は不明（根拠：K0005）\n\nD06.1 判断時点・観測窓［該当・原典報告］臨界閾値接近時の判断。観測窓長不明（根拠：K0006）<br />D06.2 処理周期・オンライン［未知］継続監視は記述されるがモデル実行・更新周期不明（確認範囲：K0006）<br />D06.3 予測起点と未来イベント［未知］未来故障時点・固定ホライズン・RUL不明（確認範囲：K0005、K0006）\n\nD07.1 タスク・出力形式［該当・原典報告］閾値接近警報。最終モデル・スコア仕様不明（根拠：K0005、K0006）<br />D07.2 異常参照基準［未知］正常参照や逸脱の定義不明（確認範囲：K0006）<br />D07.3 将来故障出力［未知］未来故障出力仕様不明（確認範囲：K0005、K0006）<br />D07.4 不確実性表現［未知］選択した根拠範囲から属性値又は適用可否を確認できない（確認範囲：K0004、K0005、K0006、K0007、K0027）<br />D07.5 通知変換［該当・原典報告］臨界閾値接近を警報化。数値閾値不明（根拠：K0006）\n\nD08.1 目的・介入・主体［該当・原典報告］警報に基づく予防清掃・交換と遮光マスク導入。担当者・計画詳細不明（根拠：K0006、K0027）<br />D08.2 必要リードタイム・負荷［未知］選択した根拠範囲から属性値又は適用可否を確認できない（確認範囲：K0004、K0005、K0006、K0007、K0027）<br />D08.3 非対称損失・安全［未知］選択した根拠範囲から属性値又は適用可否を確認できない（確認範囲：K0004、K0005、K0006、K0007、K0027）<br />D08.4 運用規模・連携［未知］選択した根拠範囲から属性値又は適用可否を確認できない（確認範囲：K0004、K0005、K0006、K0007、K0027）<br />D08.5 介入後の影響［該当・原典報告］ヘッド詰まり40%減、停止時間35%減、稼働可能性12%改善。遮光との個別寄与不明（根拠：K0007、K0027）\n\nD09.1 評価単位・対応・分割［該当・原典報告］test datasetで評価。時系列分割・照合規則・件数不明（根拠：K0005）<br />D09.2 識別・実測リードタイム［該当・原典報告］精度・適合率・再現率の評価記述。値・実測リードタイム不明（根拠：K0005）<br />D09.3 校正・不確実性検証［未知］選択した根拠範囲から属性値又は適用可否を確認できない（確認範囲：K0004、K0005、K0006、K0007、K0027）<br />D09.4 費用・評価妥当性［該当・原典報告］総保全費28%減の前後報告。費目・期間・母数・統計不確実性不明。遮光と警報による寄与は分離不能（根拠：K0007、K0027）\n\n### C02 3自治体のマンホールポンプ（B-DASH No.40）（SRC-000293）\n\n近接事例。根拠範囲：K0008、K0009、K0010、K0011、K0028、K0029。\n\nR1［未確認］現在異常検知と更新優先順位は別機能。後者の将来故障予測時点・対象未確認（K0008、K0009）<br />R2［未確認］日報・月報を扱い更新順位は点検記録を利用するが、同一未来予測・計画への実利用は未確認（K0008、K0009）<br />R3［未確認］現在異常通知後の確認・早期対応、更新優先順位は確認。未来故障予測による計画は未確認（K0008、K0009、K0028、K0029）<br />R4［不適合］348機場の導入費用試算。194機場の実測総保全費比較ではない（K0010、K0011）\n\nD01.1 対象設備・境界［該当・原典報告］下水道マンホールポンプ（根拠：K0008）<br />D01.2 対象個体・規模［該当・原典報告］実証194機場（河内長野80・今治82・赤磐32）。費用評価は別の348機場（根拠：K0008、K0011）<br />D01.3 異質性［未知］自治体・機場間の異質性の具体的属性不明（確認範囲：K0008）\n\nD02.1 故障モード［該当・原典報告］異物詰まり・エアロック等。運転に影響しない詰まりも含む（根拠：K0028）<br />D02.2 開始・進展・影響因子［未知］選択した根拠範囲から属性値又は適用可否を確認できない（確認範囲：K0008、K0009、K0010、K0011、K0028、K0029）<br />D02.3 事象頻度・率［未知］11件の緊急出動関連（非出動も含む）は設備故障率ではない（確認範囲：K0010）<br />D02.4 重症度［該当・原典報告］運転に影響しない詰まりも対象。物理的重症度尺度は不明（根拠：K0028）<br />D02.5 物理的予兆［未知］詰まりの存在は点検で確認。未来故障に先行する物理変化の検証は不明（確認範囲：K0028）\n\nD03.1 対象イベント・判定・正解単位［該当・原典報告］対象は現在の異常運転。引上げ点検で異物詰まり等を確認し判定。非警報機場も一度確認。物理故障発生の真値ではない（根拠：K0008、K0028）<br />D03.2 正常・許容［該当・原典報告］運転時間・回数の学習正常範囲（根拠：K0008）<br />D03.3 例外・除外［未知］選択した根拠範囲から属性値又は適用可否を確認できない（確認範囲：K0008、K0009、K0010、K0011、K0028、K0029）<br />D03.4 将来故障／代理イベント［サブタスク別：非該当／未知］現在異常検知は非該当。更新優先順位機能の未来イベントは未知（根拠：K0008、K0009）<br />D03.5 事象間関係［該当・原典報告］異常通知と更新優先順位は別機能。通知後の現場確認・早期対応を扱う（根拠：K0008、K0009、K0028、K0029）\n\nD04.1 運転モード・負荷［該当・原典報告］ポンプ運転時間・回数、排水量等（根拠：K0008、K0009）<br />D04.2 累積稼働・環境［該当・原典報告］更新優先順位で経過年数・劣化項目を扱う（根拠：K0009）<br />D04.3 未来条件シナリオ［未知］選択した根拠範囲から属性値又は適用可否を確認できない（確認範囲：K0008、K0009、K0010、K0011、K0028、K0029）\n\nD05.1 データ・変数［該当・原典報告］稼働時間・回数、点検記録・台帳、日報・月報。用途を分離（根拠：K0008、K0009）<br />D05.2 頻度・粒度・履歴［該当・原典報告］直近24時間集計・通常点検週1回～4か月に1回。原周期・欠測不明（根拠：K0008、K0029）<br />D05.3 観測可能性