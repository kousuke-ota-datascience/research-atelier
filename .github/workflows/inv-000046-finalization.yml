\n\nD02.1 故障モード［未知］金型機械故障を扱うが具体的故障モードはMESに未記録（確認範囲：K0036、K0038）<br />D02.2 開始・進展・影響因子［未知］選択した根拠範囲から属性値又は適用可否を確認できない（確認範囲：K0024、K0025、K0036、K0037、K0038、K0042、K0043、K0044、K0045、K0046）<br />D02.3 事象頻度・率［該当・原典報告］CM履歴の故障間稼働55–3030分。母集団全体の発生率不明（根拠：K0038）<br />D02.4 重症度［該当・原典報告］停止時間による業務影響度として修理停止5–3915分を報告。Table 3でGFTはCM停止315・585・725・3915分の4故障を先行介入に置換し、仮定した先行介入時間247.5分未満の5故障は置換しない。ただし390分の故障6も置換しないため、非回避故障は全て247.5分未満との本文説明は表と不整合。物理的重症度の尺度・分類、重症度予測の独立実証は未確認（根拠：K0038、K0045）<br />D02.5 物理的予兆［未知］選択した根拠範囲から属性値又は適用可否を確認できない（確認範囲：K0024、K0025、K0036、K0037、K0038、K0042、K0043、K0044、K0045、K0046）\n\nD03.1 対象イベント・判定・正解単位［該当・原典報告］TEは金型機械故障、BEは変数・特徴量の異常点。MESの正常0・金型機械故障1・その他不調エラーコード。故障真値の物理判定詳細不明。TE確率閾値はD07.5（根拠：K0036、K0042）<br />D03.2 正常・許容［該当・原典報告］正常0ラベルはあるが、金型・材質・設定により正常値が異なり単一正常プロファイルを置かない（根拠：K0036、K0043）<br />D03.3 例外・除外［該当・原典報告］稼働停止、金型劣化と無関係な成形機故障、段取り替え異常を除外（根拠：K0036）<br />D03.4 将来故障／代理イベント［未知］TEは金型機械故障と特定され、故障リスクを推定する設計は確認。BE累積確率から算出したTE確率が判断時点より未来の故障を表すという条件付き・時間的定義は未確認（確認範囲：K0024、K0042、K0044）<br />D03.5 事象間関係［該当・原典報告］BE異常点の発生・累積確率をTE故障リスクへ統合し、閾値に基づき予防介入を提案。実保全はCMのみ（根拠：K0024、K0038、K0042、K0044）\n\nD04.1 運転モード・負荷［該当・原典報告］成形設定・材質・使用機械等の異なる運転文脈（根拠：K0036）<br />D04.2 累積稼働・環境［該当・原典報告］直前の機械故障・修理以降の累積稼働時間、金型交換時に引き継ぐ稼働サイクル数・履歴を考慮。停止時間は除外（根拠：K0036、K0042）<br />D04.3 未来条件シナリオ［未知］選択した根拠範囲から属性値又は適用可否を確認できない（確認範囲：K0024、K0025、K0036、K0037、K0038、K0042、K0043、K0044、K0045、K0046）\n\nD05.1 データ・変数［該当・原典報告］123変数から10選択、MES文脈、5分窓最大・最小・平均・標準偏差・窓間差。80種類のBE候補。追加温湿度は品質目的で健全性評価には不使用（根拠：K0024、K0037、K0043）<br />D05.2 頻度・粒度・履歴［該当・原典報告］1Hz取得・5分集約・1か月観測。976.16MB→1.93MB/月（根拠：K0024、K0037）<br />D05.3 観測可能性・ラベル源［該当・原典報告］BEはIsolation Forestの異常点、TEは金型機械故障。MES正常・金型故障ラベル・他のエラーコード。詳細故障モード・復旧行為は未記録（根拠：K0036、K0038、K0042、K0043）<br />D05.4 観測境界・打切り［未知］選択した根拠範囲から属性値又は適用可否を確認できない（確認範囲：K0024、K0025、K0036、K0037、K0038、K0042、K0043、K0044、K0045、K0046）<br />D05.5 データ生成過程［該当・原典報告］実設備データ取得と履歴シナリオ比較。実介入はCMのみ（根拠：K0024、K0025、K0038）<br />D05.6 段階別ラベル［該当・原典報告］MESに正常0・金型機械故障1。Isolation Forestはデータの80%で学習しcontamination比を引用方法で設定。正常限定学習か、学習・検証・評価のラベル割付と時系列分割は未確認（根拠：K0036、K0043）\n\nD06.1 判断時点・観測窓［該当・原典報告］5分集約・窓間差。BE発生分布の原点は直前機械故障・修理以降の稼働時間、停止時間除外、5分刻みCDF。発生済BEは学習分布最大値に更新。金型識別を予測直前に参照する。判断時点以降の窓は別（D06.3）（根拠：K0036、K0037、K0042、K0046）<br />D06.2 処理周期・オンライン［未知］リアルタイムの提案・エッジ配布を設計し、金型IDを予測直前に参照する。1Hzは取得、5分は集約・CDF離散化。実稼働推論の周期・オンライン実行仕様、再学習実設定は未確認（月次等は設計上の選択肢）（確認範囲：K0037、K0042、K0046）<br />D06.3 予測起点と未来イベント［未知］BE分布の時間原点（直前機械故障・修理からの累積稼働時間）と5分刻み更新は確認。これは判断時点より未来の故障時間窓・RUL・条件付き故障確率を定義するものではない。TEの未来との時間関係は未確認（確認範囲：K0042、K0044）\n\nD07.1 タスク・出力形式［該当・原典報告］Isolation ForestでBE異常点を抽出、GFTでTE金型機械故障の確率pを計算し介入を提案（根拠：K0042、K0043、K0044）<br />D07.2 異常参照基準［該当・原典報告］金型・材質・成形条件により正常値が異なるため単一正常プロファイルを置かず、Isolation Forestで変数・特徴量ごとの異常点を分離。contamination設定方法は引用、数値不明（根拠：K0043）<br />D07.3 将来故障出力［未知］TE（機械故障）確率pというリスク表現は確認。BEの経過稼働時間CDFと発生済BE更新を使うが、TEが判断時点より未来の条件付き故障確率・RUL等の予後出力として定義されるかは未確認（確認範囲：K0042、K0044）<br />D07.4 不確実性表現［未知］選択した根拠範囲から属性値又は適用可否を確認できない（確認範囲：K0024、K0025、K0036、K0037、K0038、K0042、K0043、K0044、K0045、K0046）<br />D07.5 通知変換［該当・原典報告］TE確率pの介入閾値を各木で0.50～1.00・0.01刻みで探索し、到達時に予防介入を提案。GFT構造探索の目的は介入間隔別停止時間比の総和（D09.4）（根拠：K0044）\n\nD08.1 目的・介入・主体［該当・原典報告］TE確率閾値到達で次回CMを先行介入へ置換する履歴評価により木構造・閾値を最適化。先行介入時間247.5分を仮定し、長時間停止の4故障（1・4・7・8）を置換する一方、短時間停止5故障はCMのままとした。故障6（390分）も未置換であり、単純な停止時間閾値規則とは認定しない。停止影響度に応じて選択的に介入する方策の履歴比較で、実保全はCMのみ（根拠：K0038、K0044、K0045）<br />D08.2 必要リードタイム・負荷［未知］選択した根拠範囲から属性値又は適用可否を確認できない（確認範囲：K0024、K0025、K0036、K0037、K0038、K0042、K0043、K0044、K0045、K0046）<br />D08.3 非対称損失・安全［該当・分析上の推論］原典報告：短時間CMでは先行点検・保全の方が不稼働を増やし得るため、長時間故障と不要な介入の費用を考慮する。分析上、この設計は不要介入と故障を回避できない場合の損失差を考慮し得る。ただしFP/FN別損失、コスト行列・安全制約は未確認で、介入費用と誤判定損失は同一ではない（根拠：K0038、K0044、K0045）<br />D08.4 運用規模・連携［該当・原典報告］Raspberry Pi 4、Docker、MQTT、InfluxDB、EUROMAP63・MES連携。生976.16MB/月→集約1.93MB/月（根拠：K0024、K0037）<br />D08.5 介入後の影響［非該当］予防介入が実施されていないため、その実測介入後成果は非該当（根拠：K0025、K0038）\n\nD09.1 評価単位・対応・分割［該当・原典報告］Isolation Forestは80%学習。GFT木構造を介入間隔別停止時間比の総和で探索し、各木の閾値0.50～1.00を0.01刻みで最適化。CM履歴・最適PM・GFTのシナリオ比較は確認、時間分割・閾値選択と費用比較の独立性は未確認。実運用前後比較ではない（根拠：K0025、K0043、K0044、K0045）<br />D09.2 識別・実測リードタイム［未知］選択した根拠範囲から属性値又は適用可否を確認できない（確認範囲：K0024、K0025、K0036、K0037、K0038、K0042、K0043、K0044、K0045、K0046）<br />D09.3 校正・不確実性検証［未知］TE確率は計算するが、確率校正・不確実性検証、将来期間の予後性能の検証は未確認（確認範囲：K0042、K0044、K0045）<br />D09.4 費用・評価妥当性［該当・原典報告］Eq.(1) Cost=Σ\\_i ut\\_i/(wt\\_i+ut\\_i)（wt\\_i：介入間隔の稼働時間、ut\\_i：対応する停止時間）を目的関数として木構造・介入閾値を最適化。分析上、介入間隔別停止時間比の総和は全期間総停止時間÷総稼働・停止時間と一般に一致しない。先行介入をCM中央値247.5分と仮定し、著者はCM比63.43%、最適PM比27.05%の低減を履歴推定。短時間CMより先行介入が高コストの場合を考慮した選択的介入であり、本文・Table 3に非回避故障の説明上の不整合あり（D02.4）。学習・閾値選択から独立した費用評価、重症度予測性能の独立実証は未確認。金額としての実測総保全費・外的妥当性は未確立（根拠：K0025、K0038、K0044、K0045）\n\n### C11 JFE 製鉄設備の故障復旧支援（SRC-000304）\n\n除外事例（故障後支援）。根拠範囲：K0026。\n\nR1［不適合］故障後の復旧資料検索であり未来予測なし（K0026）<br />R2［未確認］日報・故障報告等を故障後に検索。稼働データとの同一未来予測・計画での利用不明（K0026）<br />R3［不適合］故障後の復旧支援（K0026）<br />R4［未確認］復旧時間短縮を報告、総保全費実績不明（K0026）\n\nD01.1 対象設備・境界［該当・原典報告］製鉄所の生産ライン（根拠：K0026）<br />D01.2 対象個体・規模［該当・原典報告］6製鉄所・全ライン（根拠：K0026）<br />D01.3 異質性［未知］選択した根拠範囲から属性値又は適用可否を確認できない（確認範囲：K0026）\n\nD02.1 故障モード［未知］選択した根拠範囲から属性値又は適用可否を確認できない（確認範囲：K0026）<br />D02.2 開始・進展・影響因子［未知］選択した根拠範囲から属性値又は適用可否を確認できない（確認範囲：K0026）<br />D02.3 事象頻度・率［未知］選択した根拠範囲から属性値又は適用可否を確認できない（確認範囲：K0026）<br />D02.4 重症度［未知］選択した根拠範囲から属性値又は適用可否を確認できない（確認範囲：K0026）<br />D02.5 物理的予兆［未知］選択した根拠範囲から属性値又は適用可否を確認できない（確認範囲：K0026）\n\nD03.1 対象イベント・判定・正解単位［非該当］故障発生後の資料検索であり異常・故障の判定タスクなし（根拠：K0026）<br />D03.2 正常・許容［未知］選択した根拠範囲から属性値又は適用可否を確認できない（確認範囲：K0026）<br />D03.3 例外・除外［未知］選択した根拠範囲から属性値又は適用可否を確認できない（確認範囲：K0026）<br />D03.4 将来故障／代理イベント［非該当］未来予測なし（根拠：K0026）<br />D03.5 事象間関係［該当・原典報告］故障発生→過去資料検索→復旧支援（根拠：K0026）\n\nD04.1 運転モード・負荷［未知］選択した根拠範囲から属性値又は適用可否を確認できない（確認範囲：K0026）<br />D04.2 累積稼働・環境［未知］選択した根拠範囲から属性値又は適用可否を確認できない（確認範囲：K0026）<br />D04.3 未来条件シナリオ［未知］選択した根拠範囲から属性値又は適用可否を確認できない（確認範囲：K0026）\n\nD05.1 データ・変数［該当・原典報告］過去故障報告・日報・マニュアル。センサー統合不明（根拠：K0026）<br />D05.2 頻度・粒度・履歴［未知］記録周期・検索対象期間不明（確認範囲：K0026）<br />D05.3 観測可能性・ラベル源［非該当］予測・検知ラベルを扱うタスクではない（根拠：K0026）<br />D05.4 観測境界・打切り［未知］選択した根拠範囲から属性値又は適用可否を確認できない（確認範囲：K0026）<br />D05.5 データ生成過程［該当・原典報告］実運用の復旧資料検索（根拠：K0026）<br />D05.6 段階別ラベル［非該当］予測・検知学習ラベルを扱わない検索タスク（根拠：K0026）\n\nD06.1 判断時点・観測窓［該当・原典報告］故障発生後（根拠：K0026）<br />D06.2 処理周期・オンライン［未知］検索・情報更新周期不明（確認範囲：K0026）<br />D06.3 予測起点と未来イベント［非該当］未来故障予測なし（根拠：K0026）\n\nD07.1 タスク・出力形式［該当・原典報告］過去資料検索・復旧支援（根拠：K0026）<br />D07.2 異常参照基準［非該当］資料検索は異常判定タスクでない（根拠：K0026）<br />D07.3 将来故障出力［非該当］未来故障出力なし（根拠：K0026）<br />D07.4 不確実性表現［非該当］予測確率・不確実性出力の対象タスクではない（根拠：K0026）<br />D07.5 通知変換［非該当］予測・検知警報の通知変換なし（根拠：K0026）\n\nD08.1 目的・介入・主体［該当・原典報告］現場担当者による故障後資料検索・復旧（根拠：K0026）<br />D08.2 必要リードタイム・負荷［非該当］故障前予測リードタイムを要求するタスクでない（根拠：K0026）<br />D08.3 非対称損失・安全［未知］選択した根拠範囲から属性値又は適用可否を確認できない（確認範囲：K0026）<br />D08.4 運用規模・連携［該当・原典報告］6製鉄所・全ライン展開（根拠：K0026）<br />D08.5 介入後の影響［該当・原典報告］故障復旧時間短縮を報告。詳細・因果不明（根拠：K0026）\n\nD09.1 評価単位・対応・分割［未知］復旧支援効果の評価単位・比較設計詳細不明（確認範囲：K0026）<br />D09.2 識別・実測リードタイム［非該当］予測・検知性能指標は対象外。復旧時間はD08.5（根拠：K0026）<br />D09.3 校正・不確実性検証［非該当］予測出力の校正対象なし（根拠：K0026）<br />D09.4 費用・評価妥当性［未知］総保全費実績・比較条件不明（確認範囲：K0026）\n\n## Key Judgments\n\n- 完全適合0件。4条件の個別判定から、R1/R3はQuantzig、R2はiFactory、R4はLEF2-200が条件別参照先。総合順位は設定しない。\n- B-DASHは異常通知・更新順位を分離し、194機場の出動関連推定と348機場の費用試算を分離する。\n- 富山市のLCC低減は目標で実績未確認。\n- 真空ポンプ・MDTIの費用削減報告は総範囲・定期記録・未来予測仕様未確認。 突発停止損失の見逃し損失への対応付けは分析上の推論で、誤判定損失の非対称性は未確認。\n- iFactoryはシフト記録内の稼働データを通知・作業依頼に実利用する。広義費用43%減は狭義総保全費と同一視しない。 シフト周期・同一シフト検出実績は推論の実行周期・オンライン性を確定しない。\n- 逆浸透は実装されたV-RMS軌跡予測と故障確率の警報条件記述を分離。故障確率の算出・対象・時間窓・個別実装・校正は未確認。オンライン監視・確認後診断とGRU推論周期は別。保全ログの運用評価・導入証跡を定期記録の予測・保全計画への利用に読み替えない。\n- 11事例×39軸の定義と個別根拠を維持し、Review 000002でC07/C10の関連軸・4条件、全事例の実行周期・誤判定損失を再照合した。\n- C08はB-1B SBA個別導入のみ。PANDA一般機能・C3全体・DIU集約成果を背景として分離し、個別性能に帰属させない。\n- QuantzigはRUL・故障確率と計画者への推奨を報告。定期日報実利用・総費用範囲・独立検証は未確認。\n- OLIはBEの異常点発生CDFを直前故障・修理以降の累積稼働時間で更新し、TEは金型機械故障。GFTはEq.(1)の介入間隔別停止時間比の総和を目的に木構造・介入閾値を探索する。履歴比較では先行介入を247.5分と仮定し長時間停止4故障を置換、短時間停止5故障と390分の故障6を未置換とした。全期間不稼働率・実績総保全費と同一視せず、TE確率の未来条件付き意味、重症度予測性能、費用評価の学習からの独立性は未確認。実保全はCMのみで、予防介入は提案・履歴推定。\n- JFEは故障後復旧支援で除外。\n\n## Limitations\n\n- 非体系的探索で全検索履歴未保存。特許本文未取得、Quantzig・OLIは公開元索引本文のみ、先行射出成形候補は別資料としてスクリーニング段階で選択外。11事例に限定し、不存在・出現率・飽和は主張しない。\n- 原典の報告を独立検証・因果確立と同一視しない。特にLEF2-200の遮光と警報の寄与、逆浸透の前後比較交絡、ベンダーの費用範囲・比較期間・分母は未確定。\n- 固定39軸での記述であり、未知・非該当を区別。軸の独立性・完全性や業界横断の予測性能比較は検証対象外。\n- 逆浸透で故障確率は警報条件の記載にとどまり、個別実装・定義・校正は確認不能。OLIでTE確率の未来条件付き意味・費用比較の学習からの独立性は未確認。取得・特徴抽出・集約周期と推論実行周期、介入費用とFP/FN損失を区別する。\n- OLIの費用目的関数は介入間隔別停止時間比の総和であり、全期間不稼働率や金額での総保全費ではない。Table 3では390分の故障6も先行介入に置換されず、本文の非回避故障はすべて247.5分未満との説明と不整合。選択的介入の履歴結果は重症度予測性能の独立実証ではない。\n\n## Unresolved Questions\n\n- 印刷設備の運転員記録の定期性・利用方法、未来故障イベント・ホライズンを確認できるか。\n- Quantzigの個別顧客で定期記録を実利用したか、費用全範囲と比較設計を確認できるか。\n- iFactoryの未来故障目的変数・予測窓、総保全費の範囲・バッチ損失との分離を確認できるか。\n- 逆浸透の故障確率の算出・対象・未来窓・個別実装・校正、振動境界の物理故障代理性、定期記録の予測・保全計画利用、実績総保全費を確認できるか。\n- 全条件を満たす追加実運用事例があるか。\n- OLIのTE確率を判断時点以後の故障予後として定義しているか、GFT構造・閾値探索と費用比較が独立か、実運用周期・実施された予防計画と総保全費を確認できるか。\n\n## Alternative Interpretations\n\n- 現在異常検知や閾値接近警報を広義予知保全として扱えば候補は増えるが、frozen Contextの明示的未来予測条件は変更しない。\n- 停止損失や品質・バッチ損失を含む経済便益評価も可能だが、総保全費と区別する。\n- 印刷設備の改善は遮光による乾燥抑制・警報後清掃交換の複合効果かもしれず、予知保全単独の寄与は識別できない。"
