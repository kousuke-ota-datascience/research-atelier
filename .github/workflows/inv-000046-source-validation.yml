name: INV-000046 Source metadata candidate validation
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'jsonschema>=4.18'
      - name: Validate exact Source JSONs against canonical schema
        run: |
          python - <<'PY'
          import json, pathlib, subprocess
          from jsonschema import Draft202012Validator, FormatChecker
          schema=json.loads(pathlib.Path('schemas/v2/information_source.schema.json').read_text())
          validator=Draft202012Validator(schema, format_checker=FormatChecker())
          for n in range(293,300):
              path=pathlib.Path(f'information_sources/SRC-{n:06d}.json')
              obj=json.loads(path.read_text())
              validator.validate(obj)
              assert obj['source_id']==path.stem
              print(path, subprocess.check_output(['git','hash-object',str(path)],text=True).strip(), 'PASS')
          PY
          PYTHONPATH=src python -m research_atelier.validation.validate_investigation INV-000046 --through 00
