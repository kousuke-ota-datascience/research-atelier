name: Canonical validator — INV-000038 repaired chain
on:
  pull_request:
    branches: [main]
    paths:
      - 'investigations/INV-000038/**'
      - 'information_sources/**'
      - '.github/workflows/inv-000038-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full repository history for Source revision checks
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install canonical validator dependencies
        run: python -m pip install 'jsonschema>=4.18'
      - name: Canonical through-30 check
        env:
          PYTHONPATH: src
        run: |
          python -m research_atelier.validation.validate_investigation INV-000038 --through 30
