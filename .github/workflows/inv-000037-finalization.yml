name: Validate INV-000037 finalization
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/research_atelier/projection/**'
      - 'tests/test_working_answer_projection.py'
      - 'investigations/INV-000037/**'
      - '.github/workflows/inv-000037-finalization.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install 'jsonschema>=4.18'
      - name: Test canonical projection renderer and v2 log schema
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_working_answer_projection.py' -v
      - name: Validate reviewed investigation chain
        env:
          PYTHONPATH: src
        run: python -m research_atelier.validation.validate_investigation INV-000037 --through 30
