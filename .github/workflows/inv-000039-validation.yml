name: Canonical validator INV-000039
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'jsonschema>=4.18'
      - name: Canonical CLI through-30
        env:
          PYTHONPATH: src
        run: python -m research_atelier.validation.validate_investigation INV-000039 --through 30
